<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deseo (beta)</title>
<style>
:root{--win:#d9d5c7;--bar:#33426a;--ink:#1d1d1d;--red:#c0392b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font:14px/1.45 Tahoma,Verdana,sans-serif;color:var(--ink);background:linear-gradient(160deg,#252c38,#4b5c68 60%,#33394a);display:flex;flex-direction:column}
button{font:inherit;color:var(--ink);background:var(--win);border:2px outset #f4f1e6;padding:5px 10px;cursor:pointer}
button:focus-visible{outline:2px dashed var(--red);outline-offset:2px}
#ds{flex:1;position:relative;min-height:0}
#ic{display:grid;grid-template-columns:repeat(4,92px);gap:12px;padding:18px}
.i{position:relative;background:none;border:0;color:#e8e8e8;width:92px;padding:0;text-align:center}
.i svg{display:block;margin:0 auto 4px}
.i:disabled{opacity:.4;cursor:default}
.i.bd:after{content:"";position:absolute;top:0;right:22px;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid #fff}
#tr{position:absolute;right:16px;bottom:12px}
#wn{position:absolute;inset:10px;background:var(--win);border:2px outset #f4f1e6;display:flex;flex-direction:column;z-index:5}
#wn[hidden]{display:none}
#wt{display:flex;justify-content:space-between;align-items:center;background:var(--bar);color:#fff;padding:3px 6px 3px 10px;font-weight:bold}
#x{padding:0 8px;line-height:1.2}
#wb{flex:1;min-height:0;position:relative;display:flex;overflow:hidden}
#wb.wbw{flex-direction:column;overflow:auto}
.in{padding:16px}
.d{color:#5a574d}
.sp{gap:30px;padding:16px}
.an{font:bold 44px Georgia,serif;margin:0;width:30%}
.col{flex:1;max-width:560px;margin:0 auto;overflow:auto;height:100%}
.p{background:#f1eee3;border:1px solid #9a968a;border-radius:10px;padding:10px;margin-bottom:12px}
.im{margin:6px 0;min-height:120px;background:repeating-linear-gradient(45deg,#b9b5a6 0 6px,#c6c2b3 6px 12px);display:grid;place-items:center;text-align:center;padding:8px;font-style:italic}
.im.ph{padding:0;min-height:0;background:none;display:block}.im.ph.nat img{aspect-ratio:auto;max-width:100%;height:auto;object-fit:contain}
.im.ph img{display:block;width:100%;max-width:380px;aspect-ratio:1/1;object-fit:cover;border-radius:6px}
.ct{color:#5a574d;margin-top:4px}
.cm{margin-top:6px;border-top:1px solid #c9c5b6;padding-top:4px}
.cl{width:200px;border-right:1px solid #9a968a;padding:10px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.k2{text-align:left}
.k2.on{border-style:inset;background:#c9c5b6}
.cp{flex:1;display:flex;flex-direction:column;background:#fff;margin:10px;border-radius:10px;min-height:0}
.ms{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:70%;padding:8px 12px;border-radius:14px;background:#d6d0be}
.m.me{align-self:flex-end;background:#bdbdbd}
.bar{border-top:1px solid #bbb;padding:10px;min-height:54px}
.snd{border-radius:14px;background:#e7d9a8}
.br{padding:8px 14px 0;border-bottom:1px solid #9a968a}
.tab{display:inline-block;border:1px solid #9a968a;border-bottom:0;padding:3px 14px;background:#f1eee3}
.ar{display:flex;justify-content:space-between;padding:6px 14px;font-size:15px}
.nt{padding:0 14px;min-height:1.6em;color:var(--red)}
.gr{display:grid;grid-template-columns:repeat(3,1fr);justify-items:center;gap:0 20px;padding:0 14px 14px}
.p0{grid-area:2/1}.p1{grid-area:1/2}.p2{grid-area:2/3}.p3{grid-area:3/1}.p4{grid-area:4/2}.p5{grid-area:3/3}
.w{display:flex;flex-direction:column;align-items:center;gap:3px}
.w span{font:20px Georgia,serif}
.cd{width:92px;height:124px;border:2px solid #6c63a8;border-radius:8px;background:#bab3e8;color:#2a2550;display:grid;place-content:center;gap:4px;text-align:center}
.cd b{font:bold 24px Georgia,serif}
.cd small{font-size:11px}
.inv{transform:rotate(180deg)}
.md{position:absolute;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center}
.md div{background:var(--win);padding:18px;border:2px outset #f4f1e6;text-align:center}
#sb{position:fixed;left:0;right:0;bottom:48px;z-index:9;pointer-events:none;text-align:center;background:rgba(20,20,20,.84);color:#eee9dc;font:20px/1.35 Georgia,serif;padding:12px 18px}
#sb:empty{display:none}
#tk{height:48px;flex:none;background:#d4d4d4;border-top:2px solid #9a9a9a;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:10}
#sl{opacity:.5}#sl.on{opacity:1;background:#e7d9a8}
.u{background:none;border:0;padding:0;font-weight:bold;color:#2a3c70;text-decoration:underline}.cb{padding:1px 8px;margin-left:6px}.lk{background:none;border:0;padding:0;font:inherit;color:#1a47c8;text-decoration:underline;cursor:pointer}.cms{margin-top:4px}.pf{width:30%;overflow:auto}.av{width:120px;height:120px;margin:10px 0;background:repeating-linear-gradient(45deg,#b9b5a6 0 6px,#c6c2b3 6px 12px);display:grid;place-items:center;text-align:center;font:italic 12px Tahoma;padding:6px}.av:has(img){padding:0;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}.ao{width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px}
.ty i{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:#6b685e;animation:bl 1s infinite}.ty i:nth-child(2){animation-delay:.2s}.ty i:nth-child(3){animation-delay:.4s}@keyframes bl{50%{opacity:.2}}
#fd{position:fixed;inset:0;z-index:20;background:#000;color:#e8e4d4;font:48px Georgia,serif;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .9s}
#fd.on{opacity:1;pointer-events:auto}
</style></head><body>
<div id="ds"><div id="ic"></div>
<button class="i" id="tr"></button>
<div id="wn" hidden><div id="wt"><span id="wtt"></span><button id="x" aria-label="Cerrar">×</button></div><div id="wb"></div></div></div>
<div id="sb" aria-live="polite"></div>
<div id="tk"><b id="dl"></b><span><button id="rs">Reiniciar</button> <button id="sl">Apagar</button></span></div>
<div id="fd" class="on"></div>
<script src="datos.js"></script>
<script>
const W=[["Dinero","El Mago","I"],["Amor","Los Enamorados","VI"],["Salud","La Estrella","XVII"],["Abundancia","La Emperatriz","III"],["Muerte","La Muerte","XIII"],["Belleza","El Sol","XIX"]];
const S=p=>'<svg viewBox="0 0 16 16" width="44" height="44" shape-rendering="crispEdges" fill="none" stroke="#1b1b1b">'+p+"</svg>";
const IC={hilo:S('<path d="M1.5 2.5h13v8h-6l-3 3v-3h-4z" fill="#cfd8dc"/><path d="M4 5.5h8M4 7.5h5"/>'),
msg:S('<rect x="1.5" y="3.5" width="13" height="9" fill="#f1eee3"/><path d="M1.5 3.5l6.5 5 6.5-5"/>'),
rollo:S('<rect x="1.5" y="2.5" width="13" height="11" fill="#f6e3b0"/><circle cx="5" cy="6" r="1.2" fill="#e8a33d"/><path d="M1.5 12l4-4 3 3 2-2 4 4" fill="#8fb28a"/>'),
gal:S('<path d="M1.5 4.5h5l1 1.5h7v7.5h-13z" fill="#e9c46a"/>'),
web:S('<rect x="1.5" y="2.5" width="13" height="11" fill="#f1eee3"/><path d="M1.5 5.5h13"/><circle cx="8" cy="9.5" r="2.5" fill="#9ec5e8"/>'),
jgo:S('<rect x="1.5" y="5.5" width="13" height="6" rx="2" fill="#b8b2d8"/><path d="M4 8.5h3M5.5 7v3"/><circle cx="11" cy="8.5" r=".8"/>'),
tra:S('<path d="M4 4.5h8l-1 9H5z" fill="#cfd8dc"/><path d="M3 4.5h10M6.5 2.5h3v2M6.5 7v4M9.5 7v4"/>')};
const $=i=>document.getElementById(i),E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const ip=f=>'src="'+f+'" onerror="if(!this.dataset.t){this.dataset.t=1;this.src=\''+f+'\'}else{this.replaceWith(\'[falta '+f+']\')}"';
const KEY={hilo:"feed",rollo:"gram",gal:"gal"};
let day=0,seen={},prog={},wish=0,uw=0,A=null,C=null,tm,was=0,ty={},PF=null;
try{const s=JSON.parse(localStorage.getItem("deseo3")||"{}");day=s.day||0;seen=s.seen||{};prog=s.prog||{};wish=s.wish||0;uw=s.uw||wish||0}catch(e){}
const save=()=>{try{localStorage.setItem("deseo3",JSON.stringify({day,seen,prog,wish,uw}))}catch(e){}};
function sub(t){$("sb").textContent=t||"";clearTimeout(tm);if(t)tm=setTimeout(()=>$("sb").textContent="",7000)}
const cts=()=>{const s=Object.keys(P);for(let d=0;d<=day;d++)for(const c in D[d].ch||{})if(!s.includes(c))s.push(c);
 const o=(D[day].req||[]).concat(Object.keys(D[day].ch||{}));return s.sort((a,b)=>(o.indexOf(a)+1||99)-(o.indexOf(b)+1||99))};
const lockMsg=c=>{const x=((D[day].need||{})[c]||[]).find(x=>KEY[x]?pend(x):left(x));return (D[day].lm||{})[x]||"Todavía no."};
const locked=c=>((D[day].need||{})[c]||[]).some(x=>KEY[x]?pend(x):left(x));
const left=c=>((D[day].ch||{})[c]||[]).length-(prog[day+"|"+c]||0)>0;
function pend(a){const d=D[day];
 if(a=="msg")return (d.req||[]).some(left);
 if(a=="web")return !!(d.wish&&!wish&&uw);
 const k=KEY[a];return (d[k]||[]).some((it,n)=>it[5]&&!seen[k+"-"+day+"-"+n])||(a=="hilo"&&!!d.wish&&!wish&&!uw)}
const done=()=>["msg","web","hilo","rollo","gal"].every(a=>!pend(a));
function hdr(){$("dl").textContent="Día "+(day+1)+" · "+D[day].t;const f=done();$("sl").className=f?"on":"";
 ["hilo","msg","rollo","gal","web"].forEach(a=>$("i_"+a).classList.toggle("bd",!!pend(a)));
 if(f&&!was)setTimeout(()=>{if(done())sub("Ya debería ir a dormir.")},4500);was=f}
const obs=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const k=e.target.dataset.k;
 if(!seen[k]){seen[k]=1;save();const p=k.split("-");sub(D[p[1]][p[0]][p[2]][4]);hdr()}obs.unobserve(e.target)}),{threshold:.5});
function pump(c){const d=day;if(ty[c]||locked(c))return;
 const st=(D[d].ch||{})[c]||[],k=d+"|"+c,p=prog[k]||0,m=st[p];
 if(m==null||m[0]==">")return;
 const first=p==0&&m[0]!="~"&&m[0]!=">";
 ty[c]=1;if(!first&&A=="msg")render();
 setTimeout(()=>{prog[k]=p+1;save();ty[c]=0;if(m[0]=="~")sub(m.slice(1));if(A=="msg")render();hdr();if(d==day)pump(c)},m[0]=="~"?400:first?0:900+Math.min(m.length,60)*22)}
const rl=u=>{if(typeof u.r!="object")return u.r||"";let r="";for(const k in u.r)if(+k<=day)r=u.r[k];return r};
const bio=u=>{if(typeof u.b!="object")return u.b||"";let r="";for(const k in u.b)if(+k<=day)r=u.b[k];return r};
const LK=s=>s.replace(/uwish\.net/g,'<button class="lk">uwish.net</button>');
function card(it,key,a){const p=E("div","p"),g=a=="gal",c=it[6]||[];
 const uf=U[it[0]]&&U[it[0]].f?'<img class="ao" '+ip(U[it[0]].f)+' alt="">':"";
 let h=g?"":'<button class="u">'+uf+it[0]+"</button>";
 const mm=it[2]&&/^\[([^\]]+)\]\s*([\s\S]*)$/.exec(it[2]),dsc=mm?mm[2]:it[2],nat=mm&&mm[1][0]=="=",fn=mm?mm[1].replace(/^=/,""):"";
 if(it[2])h+=mm?'<div class="im ph'+(nat?" nat":"")+'"><img src="'+fn+'" alt=""></div>':'<div class="im">'+it[2]+"</div>";
 if(it[1])h+="<p>"+LK(it[1])+"</p>";
 if(!g)h+='<div class="ct">♡ '+it[3]+(a=="hilo"?"  ⇄ "+(it[3]/9|0):"")+'  <button class="cb">✎ '+c.length+'</button></div><div class="cms" hidden>'+(c.length?c.map(x=>'<div class="cm">'+LK(x)+"</div>").join(""):'<div class="cm d">Sin comentarios.</div>')+"</div>";
 p.innerHTML=h;
 const gi=p.querySelector(".im.ph img");if(gi){gi.alt=dsc;const bs=fn.replace(/\.\w+$/,""),cd=[fn].concat(["jpeg","jpg","png"].map(e=>bs+"."+e).filter(x=>x!=fn));let ci=0;gi.onerror=()=>{ci++;if(ci<cd.length)gi.src=cd[ci];else{const bx=gi.parentNode;bx.className="im";bx.textContent=dsc}}}
 p.querySelectorAll(".lk").forEach(b=>b.onclick=()=>{uw=1;save();hdr();go("web")});
 const u=p.querySelector(".u");if(u)u.onclick=()=>{PF=it[0];render()};
 const cb=p.querySelector(".cb");if(cb)cb.onclick=()=>{const m=p.querySelector(".cms");m.hidden=!m.hidden};
 if(key){p.dataset.k=key;if(it[5]&&!seen[key])obs.observe(p)}
 return p}
function prof(b){
 const u=U[PF]||{n:PF,b:"",a:"foto de perfil por defecto"};b.className="sp";
 b.append(E("div","pf",'<button id="bk">← Volver</button><div class="av">'+(u.f?'<img '+ip(u.f)+' alt="'+u.a+'">':u.a)+"</div><h2>"+u.n+'</h2><div class="d">'+PF+(u.i?" · "+u.i:"")+"</div><p>"+bio(u)+"</p>"));
 const col=E("div","col");b.append(col);let any=0;
 for(let d=day;d>=0;d--)["feed","gram"].forEach(k=>(D[d][k]||[]).forEach(it=>{if(it[0]==PF){any=1;col.append(card(it,null,k=="feed"?"hilo":"rollo"))}}));
 (u.pre||[]).forEach(it=>{any=1;col.append(card(it,null,"rollo"))});
 if(!any)col.innerHTML='<p class="d">Sin publicaciones.</p>';
 if(u.sb&&!bio(u)&&!seen["sb"+PF]){seen["sb"+PF]=1;save();sub(u.sb)}
 const r=rl(u);if(r&&!seen["r"+PF+r]){seen["r"+PF+r]=1;save();sub(r)}
 $("bk").onclick=()=>{PF=null;render()}}
function feed(b,a){
 const g=a=="gal",k=KEY[a];if(PF&&!g)return prof(b);b.className="sp";
 if(!g)b.append(E("h1","an",a=="hilo"?"SayIt":"Popping"));
 const col=E("div","col");b.append(col);let any=0;
 for(let d=day;d>=0;d--)(D[d][k]||[]).forEach((it,n)=>{any=1;col.append(card(it,k+"-"+d+"-"+n,a))});
 if(!any)col.innerHTML='<p class="d">Nada por ahora.</p>'}
function chat(b){
 b.className="";const l=E("div","cl");
 cts().forEach(c=>{const k=E("button","k2"+(c==C?" on":""),c+(left(c)&&!locked(c)?" ●":""));k.onclick=()=>{if(locked(c)){sub(lockMsg(c));return}C=c;pump(c);render()};l.append(k)});
 const p=E("div","cp"),ms=E("div","ms"),br=E("div","bar"),add=s=>{if(s[0]=="~")return;const me=s[0]==">";ms.append(E("div","m"+(me?" me":""),me?s.slice(1):s))};
 (P[C]||[]).forEach(add);
 for(let d=0;d<=day;d++){const st=(D[d].ch||{})[C]||[],n=d<day?st.length:(prog[d+"|"+C]||0);st.slice(0,n).forEach(add)}
 const st=(D[day].ch||{})[C]||[],pn=prog[day+"|"+C]||0,nx=st[pn];
 if(ty[C]&&pn>0&&nx&&nx[0]!="~"&&nx[0]!=">")ms.append(E("div","m ty","<i></i><i></i><i></i>"));
 if(nx&&nx[0]==">"){const s=E("button","snd",nx.slice(1));s.onclick=()=>{prog[day+"|"+C]=pn+1;save();hdr();render();pump(C)};br.append(s)}
 else br.append(E("span","d","mensaje"));
 p.append(ms,br);b.append(l,p);ms.scrollTop=ms.scrollHeight}
function web(b){
 b.className="wbw";
 if(day<1||!uw){b.innerHTML='<div class="in d">Sin páginas abiertas.</div>';return}
 b.append(E("div","br",'<span class="tab">UWish</span>'));
 b.append(E("div","ar","<b>UWish.net</b><span>Personas que usaron el sitio: <b>"+(7340+wish)+"</b></span>"));
 const nt=E("div","nt",wish?"Tu deseo fue registrado.":""),g=E("div","gr");b.append(nt);
 W.forEach((w,i)=>{const e=E("div","w p"+i,"<span>"+w[0]+'</span><button class="cd'+(i==1?" inv":"")+'"><b>'+w[2]+"</b><small>"+w[1]+"</small></button>");
  e.lastChild.onclick=()=>{
   if(i!=1){nt.textContent="Este deseo no está disponible. Ya fue usado por alguien.";return}
   if(wish){nt.textContent="Ya pediste tu deseo.";return}
   const m=E("div","md",'<div><p>¿Es alguien en específico?</p><button id="y">Sí</button> <button id="no">No</button></div>');b.append(m);
   $("y").onclick=()=>{m.remove();sub("No. No quiero pedir a alguien que ya me rechazó.")};
   $("no").onclick=()=>{wish=1;save();hdr();render();sub("Listo. Ya está. Qué tontería.")}};
  g.append(e)});
 b.append(g)}
function render(){
 const b=$("wb");b.innerHTML="";b.className="";obs.disconnect();
 if(A=="tra"){b.innerHTML='<div class="in d">La papelera está vacía.</div>';return}
 ({hilo:()=>feed(b,"hilo"),rollo:()=>feed(b,"rollo"),gal:()=>feed(b,"gal"),msg:()=>chat(b),web:()=>web(b)})[A]()}
function go(a){A=a;PF=null;
 if(a=="msg"){const c=cts();if(!C||!c.includes(C)||locked(C))C=c.find(x=>left(x)&&!locked(x))||c[0];pump(C)}
 $("wtt").textContent={hilo:"SayIt",msg:"Ping",rollo:"Popping",gal:"Galería",web:"Navegador",tra:"Papelera"}[a];
 $("wn").hidden=false;render()}
[["hilo","SayIt"],["msg","Ping"],["rollo","Popping"],["gal","Galería"],["web","Navegador"],["jgo","Juego"]].forEach(a=>{
 const b=E("button","i",IC[a[0]]+a[1]);b.id="i_"+a[0];if(a[0]=="jgo")b.disabled=true;else b.onclick=()=>go(a[0]);$("ic").append(b)});
$("tr").innerHTML=IC.tra+"Papelera";$("tr").onclick=()=>go("tra");
$("x").onclick=()=>{A=null;PF=null;$("wn").hidden=true};
function fade(t,f){const e=$("fd");e.textContent=t;e.className="on";setTimeout(()=>{f();setTimeout(()=>e.className="",1500)},1000)}
$("sl").onclick=()=>{
 if(!done()){sub("Todavía no quiero apagar.");return}
 if(day+1>=D.length){fade("Fin de la beta",()=>{A=null;$("wn").hidden=false;$("wtt").textContent="Fin";$("wb").className="";$("wb").innerHTML='<div class="in"><h2>Fin de la beta</h2><p>Gracias por jugar. Contale a Claude qué te gustó y qué no.</p></div>'});return}
 fade("Día "+(day+2),()=>{day++;ty={};save();A=null;$("wn").hidden=true;hdr();sub("");setTimeout(()=>sub(D[day].t),1800)})};
$("rs").onclick=()=>{if(confirm("¿Reiniciar el juego?")){try{localStorage.removeItem("deseo3")}catch(e){}location.reload()}};
hdr();$("fd").textContent="Día "+(day+1);setTimeout(()=>$("fd").className="",1400);
setTimeout(()=>sub(D[day].t+(day?"":" Tocá las apps. Cuando termines, apagá.")),2300);
</script></body></html>

<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deseo (beta)</title>
<style>
:root{--win:#d9d5c7;--bar:#33426a;--ink:#1d1d1d;--red:#c0392b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font:14px/1.45 Tahoma,Verdana,sans-serif;color:var(--ink);background:linear-gradient(160deg,#252c38,#4b5c68 60%,#33394a);display:flex;flex-direction:column}
button{font:inherit;color:var(--ink);background:var(--win);border:2px outset #f4f1e6;padding:5px 10px;cursor:pointer}
button:focus-visible{outline:2px dashed var(--red);outline-offset:2px}
#ds{flex:1;position:relative;min-height:0}
#ic{display:grid;grid-template-columns:repeat(4,92px);gap:14px;padding:18px}
.i{position:relative;background:none;border:0;color:#e8e8e8;width:92px;padding:0;text-align:center}
.i b{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 4px;border-radius:50%;background:#d4d4d4;color:#2d2d2d;font-size:26px}
.i:disabled{opacity:.4;cursor:default}
.i.bd:after{content:"";position:absolute;top:0;right:12px;width:14px;height:14px;border-radius:50%;background:var(--red);border:2px solid #fff}
#tr{position:absolute;right:16px;bottom:12px}
#wn{position:absolute;inset:10px;background:var(--win);border:2px outset #f4f1e6;display:flex;flex-direction:column;z-index:5}
#wn[hidden]{display:none}
#wt{display:flex;justify-content:space-between;align-items:center;background:var(--bar);color:#fff;padding:3px 6px 3px 10px;font-weight:bold}
#x{padding:0 8px;line-height:1.2}
#wb{flex:1;min-height:0;position:relative;display:flex;overflow:hidden}
#wb.wbw{flex-direction:column;overflow:auto}
.in{padding:16px}
.d{color:#5a574d}
.sp{gap:30px;padding:16px}
.an{font:bold 44px Georgia,serif;margin:0;width:30%}
.col{flex:1;max-width:560px;margin:0 auto;overflow:auto;height:100%}
.p{background:#f1eee3;border:1px solid #9a968a;border-radius:10px;padding:10px;margin-bottom:12px}
.im{margin:6px 0;min-height:130px;background:repeating-linear-gradient(45deg,#b9b5a6 0 6px,#c6c2b3 6px 12px);display:grid;place-items:center;text-align:center;padding:8px;font-style:italic}
.ct{color:#5a574d;margin-top:4px}
.cm{margin-top:6px;border-top:1px solid #c9c5b6;padding-top:4px}
.cl{width:200px;border-right:1px solid #9a968a;padding:10px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.k2.on{border-style:inset;background:#c9c5b6}
.cp{flex:1;display:flex;flex-direction:column;background:#fff;margin:10px;border-radius:10px;min-height:0}
.ms{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:70%;padding:8px 12px;border-radius:14px;background:#d6d0be}
.m.me{align-self:flex-end;background:#bdbdbd}
.bar{border-top:1px solid #bbb;padding:10px;min-height:54px}
.snd{border-radius:14px;background:#e7d9a8}
.br{padding:8px 14px 0;border-bottom:1px solid #9a968a}
.tab{display:inline-block;border:1px solid #9a968a;border-bottom:0;padding:3px 14px;background:#f1eee3}
.ar{display:flex;justify-content:space-between;padding:6px 14px;font-size:15px}
.nt{padding:0 14px;min-height:1.6em;color:var(--red)}
.gr{display:grid;grid-template-columns:repeat(3,1fr);justify-items:center;gap:0 20px;padding:0 14px 14px}
.p0{grid-area:2/1}.p1{grid-area:1/2}.p2{grid-area:2/3}.p3{grid-area:3/1}.p4{grid-area:4/2}.p5{grid-area:3/3}
.w{display:flex;flex-direction:column;align-items:center;gap:3px}
.w span{font:20px Georgia,serif}
.cd{width:92px;height:124px;border:2px solid #6c63a8;border-radius:8px;background:#bab3e8;color:#2a2550;display:grid;place-content:center;gap:4px;text-align:center}
.cd b{font:bold 24px Georgia,serif}
.cd small{font-size:11px}
.inv{transform:rotate(180deg)}
.md{position:absolute;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center}
.md div{background:var(--win);padding:18px;border:2px outset #f4f1e6;text-align:center}
#sb{position:fixed;left:0;right:0;bottom:48px;z-index:9;pointer-events:none;text-align:center;background:rgba(20,20,20,.84);color:#eee9dc;font:20px/1.35 Georgia,serif;padding:12px 18px}
#sb:empty{display:none}
#tk{height:48px;flex:none;background:#d4d4d4;border-top:2px solid #9a9a9a;display:flex;justify-content:space-between;align-items:center;padding:0 12px;z-index:10}
#sl{opacity:.45}#sl.on{opacity:1;background:#e7d9a8}
</style></head><body>
<div id="ds"><div id="ic"></div>
<button class="i" id="tr"><b>▭</b>Papelera</button>
<div id="wn" hidden><div id="wt"><span id="wtt"></span><button id="x" aria-label="Cerrar">×</button></div><div id="wb"></div></div></div>
<div id="sb" aria-live="polite"></div>
<div id="tk"><b id="dl"></b><span><button id="rs">Reiniciar</button> <button id="sl">Dormir</button></span></div>
<script>
/* DATOS. Cada día: t=título, ch={Contacto:[pasos]}, req=[chats obligatorios], feed/gram/gal=[items], wish=1.
 Pasos de chat: "texto"=mensaje que llega, ">texto"=mensaje que mandás vos (lo tocás), "~texto"=lo que dice el protagonista.
 Items: u=usuario i=imagen x=texto n=[me gusta,compartidos,comentarios] c=comentario s=lo que dice el protagonista r=1 obligatorio */
const D=[
{t:"Viernes. Último día de clases.",req:["Fran"],ch:{Fran:["jajaja boludo, te lo dije. Mirá cómo te dejó en el posteo.","~Él me dijo que me declarara. Él.",">Vos me dijiste que le hablara.","dale, no te hagas el ofendido","relajá, es un chiste. Mañana ya nadie se acuerda.","~Internet no se olvida."]},
 feed:[{u:"@lu_vz",x:"Hay gente que confunde amabilidad con otra cosa. Vergüenza ajena.",n:[412,38,97],s:"Cuatrocientas personas. Todos lo vieron.",r:1},{u:"@clases_2b",x:"Último día!!! Felices vacaciones",i:"foto grupal del curso",n:[230,12,40]}]},
{t:"Sábado. Primer día de vacaciones.",wish:1,ch:{Fran:["no salgas de tu casa jaja"]},
 feed:[{u:"@foro_anon",x:"probé deseos.net y funciona. no pregunten.",n:[3,0,1],s:"Un sitio de deseos. Qué tontería. Igual lo voy a mirar.",r:1},{u:"@memes_3am",x:"cuando alguien te quiere más de lo que pedís",i:"meme: en una esquina, una carta de tarot dada vuelta",n:[1900,300,52]}]},
{t:"Domingo.",req:["Alma"],ch:{Alma:["Hola! Perdón que te escriba así. Vi lo que pasó con ese posteo y no me pareció justo. Soy Alma.","~Alguien me escribió. Alguien que no me conoce.",">Hola... gracias, no sé qué decir.","No tenés que decir nada 🙂"],Fran:["con quién hablás? te veo conectado todo el día"]},
 gram:[{u:"@alma",i:"tirada de tarot sobre una mesa: Los Enamorados al revés",n:[34],s:"Le gusta el tarot.",r:1}]},
{t:"Lunes.",req:["Alma"],ch:{Alma:["¿Qué escuchás? Yo Weezer todo el día 😂",">Weezer también!! No conozco a nadie que los escuche.","~Por fin alguien que entiende.","Somos dos entonces."]},
 gram:[{u:"@vos",i:"tu calle de noche, con grano de película",n:[2],c:"@alma: me encanta cómo ves las cosas",s:"Nadie había dicho eso de mis fotos.",r:1}]},
{t:"Martes.",req:["Alma"],ch:{Alma:["Tengo un mazo desde los 12. ¿Te tiro una carta?",">Dale, tirame una.","Te salió Los Enamorados. Al revés. Jaja, no significa nada malo.","~Los Enamorados. Otra vez.","¿A qué hora dormís? Yo casi no duermo.",">A las 2 más o menos."]},
 gram:[{u:"@alma",i:"su mazo sobre una mesa. Falta una carta",n:[41],s:"Hay un hueco en el mazo."}]},
{t:"Miércoles.",req:["Alma"],ch:{Alma:["¿Dónde vivís? Yo en otra ciudad, bastante lejos.",">En el centro, cerca de la plaza.","Qué lindo por ahí. Estuve una vez.","~No le dije qué plaza."]}},
{t:"Jueves.",req:["Alma"],ch:{Alma:["Hoy te va a llegar algo. No preguntes 😊"]},
 gal:[{i:"foto en el felpudo: un KitKat y una carta de Los Enamorados (invertida). Nota: «Para que no estés triste. A.» Sin sello de correo",s:"No tiene sello. ¿Quién lo trajo?",r:1}]}
];
const W=[["Plata","El Mago","I"],["Amor","Los Enamorados","VI"],["Salud","La Estrella","XVII"],["Abundancia","La Emperatriz","III"],["Muerte","La Muerte","XIII"],["Belleza","El Sol","XIX"]];
const $=i=>document.getElementById(i),E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const KEY={hilo:"feed",rollo:"gram",gal:"gal"};
let day=0,seen={},prog={},wish=0,A=null,C=null,tm;
try{const s=JSON.parse(localStorage.getItem("deseo2")||"{}");day=s.day||0;seen=s.seen||{};prog=s.prog||{};wish=s.wish||0}catch(e){}
const save=()=>{try{localStorage.setItem("deseo2",JSON.stringify({day,seen,prog,wish}))}catch(e){}};
function sub(t){$("sb").textContent=t||"";clearTimeout(tm);if(t)tm=setTimeout(()=>$("sb").textContent="",7000)}
const cts=()=>{const s=[];for(let d=0;d<=day;d++)for(const c in D[d].ch||{})if(!s.includes(c))s.push(c);return s};
const left=c=>((D[day].ch||{})[c]||[]).length-(prog[day+"|"+c]||0)>0;
function pend(a){const d=D[day];
 if(a=="msg")return (d.req||[]).some(left);
 if(a=="web")return d.wish&&!wish;
 const k=KEY[a];return (d[k]||[]).some((it,n)=>it.r&&!seen[k+"-"+day+"-"+n])}
const done=()=>["msg","web","hilo","rollo","gal"].every(a=>!pend(a));
function hdr(){$("dl").textContent="Día "+(day+1)+" · "+D[day].t;$("sl").className=done()?"on":"";
 ["hilo","msg","rollo","gal","web"].forEach(a=>$("i_"+a).classList.toggle("bd",!!pend(a)))}
const obs=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const k=e.target.dataset.k;
 if(!seen[k]){seen[k]=1;save();const p=k.split("-");sub(D[p[1]][p[0]][p[2]].s);hdr()}obs.unobserve(e.target)}),{threshold:.5});
function pump(c){const d=day,st=(D[d].ch||{})[c]||[],k=d+"|"+c,p=prog[k]||0,s=st[p];
 if(s==null||s[0]==">")return;
 prog[k]=p+1;save();if(s[0]=="~")sub(s.slice(1));
 if(A=="msg")render();hdr();
 setTimeout(()=>{if(d==day)pump(c)},s[0]=="~"?300:900)}
function feed(b,a){
 const g=a=="gal",k=KEY[a];b.className="sp";
 if(!g)b.append(E("h1","an",a=="hilo"?"Hilo":"Rollo"));
 const col=E("div","col");b.append(col);let any=0;
 for(let d=day;d>=0;d--)(D[d][k]||[]).forEach((it,n)=>{any=1;
  const key=k+"-"+d+"-"+n,p=E("div","p");p.dataset.k=key;let h=g?"":"<b>"+it.u+"</b>";
  if(it.i)h+='<div class="im">'+it.i+"</div>";
  if(it.x)h+="<p>"+it.x+"</p>";
  if(!g){const q=it.n||[0,0,0];h+='<div class="ct">♡ '+q[0]+(a=="hilo"?"  ⇄ "+q[1]+"  ✎ "+q[2]:"")+"</div>"}
  if(it.c)h+='<div class="cm">'+it.c+"</div>";
  p.innerHTML=h;col.append(p);if(it.r&&!seen[key])obs.observe(p)});
 if(!any)col.innerHTML='<p class="d">Nada por ahora.</p>'}
function chat(b){
 b.className="";const l=E("div","cl");
 cts().forEach(c=>{const k=E("button","k2"+(c==C?" on":""),c+(left(c)?" ●":""));k.onclick=()=>{C=c;pump(c);render()};l.append(k)});
 const p=E("div","cp"),ms=E("div","ms"),br=E("div","bar");
 for(let d=0;d<=day;d++){const st=(D[d].ch||{})[C]||[],n=d<day?st.length:(prog[d+"|"+C]||0);
  for(let i=0;i<n;i++){const s=st[i];if(s[0]=="~")continue;const me=s[0]==">";ms.append(E("div","m"+(me?" me":""),me?s.slice(1):s))}}
 const st=(D[day].ch||{})[C]||[],pn=prog[day+"|"+C]||0,nx=st[pn];
 if(nx&&nx[0]==">"){const s=E("button","snd",nx.slice(1));s.onclick=()=>{prog[day+"|"+C]=pn+1;save();hdr();render();pump(C)};br.append(s)}
 else br.append(E("span","d","mensaje"));
 p.append(ms,br);b.append(l,p);ms.scrollTop=ms.scrollHeight}
function web(b){
 b.className="wbw";
 if(day<1){b.innerHTML='<div class="in d">Sin páginas abiertas.</div>';return}
 b.append(E("div","br",'<span class="tab">deseos</span>'));
 b.append(E("div","ar","<b>deseos.net</b><span>Personas que usaron el sitio: <b>"+(7340+wish)+"</b></span>"));
 const nt=E("div","nt",wish?"Tu deseo fue registrado.":""),g=E("div","gr");b.append(nt);
 W.forEach((w,i)=>{const e=E("div","w p"+i,"<span>"+w[0]+'</span><button class="cd'+(i==1?" inv":"")+'"><b>'+w[2]+"</b><small>"+w[1]+"</small></button>");
  e.lastChild.onclick=()=>{
   if(i!=1){nt.textContent="Este deseo no está disponible. Ya fue usado por alguien.";return}
   if(wish){nt.textContent="Ya pediste tu deseo.";return}
   const m=E("div","md",'<div><p>¿Es alguien en específico?</p><button id="y">Sí</button> <button id="no">No</button></div>');b.append(m);
   $("y").onclick=()=>{m.remove();sub("No. No quiero pedir a alguien que ya me rechazó.")};
   $("no").onclick=()=>{wish=1;save();hdr();render();sub("Listo. Ya está. Qué tontería.")}};
  g.append(e)});
 b.append(g)}
function render(){
 const b=$("wb");b.innerHTML="";b.className="";obs.disconnect();
 if(A=="tra"){b.innerHTML='<div class="in d">La papelera está vacía.</div>';return}
 ({hilo:()=>feed(b,"hilo"),rollo:()=>feed(b,"rollo"),gal:()=>feed(b,"gal"),msg:()=>chat(b),web:()=>web(b)})[A]()}
function go(a){A=a;
 if(a=="msg"){const c=cts();if(!C||!c.includes(C))C=c.find(left)||c[0];pump(C)}
 $("wtt").textContent={hilo:"Hilo",msg:"Mensajes",rollo:"Rollo",gal:"Galería",web:"Navegador",tra:"Papelera"}[a];
 $("wn").hidden=false;render()}
[["hilo","Hilo","≋"],["msg","Mensajes","✉"],["rollo","Rollo","◐"],["gal","Galería","▣"],["web","Navegador","◎"],["jgo","Juego","?"]].forEach(a=>{
 const b=E("button","i","<b>"+a[2]+"</b>"+a[1]);b.id="i_"+a[0];if(a[0]=="jgo")b.disabled=true;else b.onclick=()=>go(a[0]);$("ic").append(b)});
$("tr").onclick=()=>go("tra");
$("x").onclick=()=>{A=null;$("wn").hidden=true};
$("sl").onclick=()=>{
 if(!done()){sub("Todavía me falta ver algo.");return}
 if(day+1>=D.length){A=null;$("wn").hidden=false;$("wtt").textContent="Fin";$("wb").className="";$("wb").innerHTML='<div class="in"><h2>Fin de la beta</h2><p>Gracias por jugar. Contale a Claude qué te gustó y qué no.</p></div>';sub("");return}
 day++;save();hdr();if(A)render();sub(D[day].t)};
$("rs").onclick=()=>{if(confirm("¿Reiniciar el juego?")){try{localStorage.removeItem("deseo2")}catch(e){}location.reload()}};
hdr();sub(D[day].t+(day?"":" Tocá las apps. Cuando termines, dormí."));
</script></body></html>
